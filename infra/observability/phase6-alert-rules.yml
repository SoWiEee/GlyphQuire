groups:
  - name: glyphquire-phase6-probes
    interval: 30s
    rules:
      # Three 30-second samples are 90 seconds. The ratio rule covers any
      # rolling five-minute window once at least four samples exist.
      - alert: GlyphQuireProbeConsecutiveFailure
        expr: min_over_time(glyphquire_probe_success[90s]) == 0
        for: 90s
        labels:
          severity: critical
          phase6_alert: probe_failure
        annotations:
          summary: GlyphQuire probe failed three consecutive times
          delivery_deadline: 5m
      - alert: GlyphQuireProbeRollingFailure
        expr: count_over_time(glyphquire_probe_success[5m]) >= 4 and (1 - avg_over_time(glyphquire_probe_success[5m])) >= 0.5
        labels:
          severity: critical
          phase6_alert: probe_failure
        annotations:
          summary: GlyphQuire probe failures reached fifty percent in five minutes
          delivery_deadline: 5m

  - name: glyphquire-phase6-immediate
    interval: 30s
    rules:
      - alert: GlyphQuireBackupFailure
        expr: increase(glyphquire_backup_failures_total[30s]) > 0
        labels:
          severity: critical
          phase6_alert: backup_failure
        annotations:
          summary: GlyphQuire backup verification failed
          delivery_deadline: 5m
      - alert: GlyphQuireDeadLetter
        expr: increase(glyphquire_jobs_dead_lettered_total[30s]) > 0
        labels:
          severity: critical
          phase6_alert: dead_letter
        annotations:
          summary: GlyphQuire job entered the dead-letter queue
          delivery_deadline: 5m
      - alert: GlyphQuireOldestQueueJob
        expr: glyphquire_queue_oldest_job_age_seconds > 300
        labels:
          severity: critical
          phase6_alert: oldest_queue_age
        annotations:
          summary: GlyphQuire oldest queue job exceeded five minutes
          delivery_deadline: 5m

  - name: glyphquire-phase6-capacity
    interval: 30s
    rules:
      - alert: GlyphQuireDatabaseCapacityWarning
        expr: glyphquire_database_utilization_ratio >= 0.8 and glyphquire_database_utilization_ratio < 0.9
        labels:
          severity: warning
          phase6_alert: database_capacity
        annotations:
          summary: GlyphQuire database utilization reached eighty percent
          delivery_deadline: 5m
      - alert: GlyphQuireDatabaseCapacityCritical
        expr: glyphquire_database_utilization_ratio >= 0.9
        labels:
          severity: critical
          phase6_alert: database_capacity
        annotations:
          summary: GlyphQuire database utilization reached ninety percent
          delivery_deadline: 5m
      - alert: GlyphQuireDiskCapacityWarning
        expr: glyphquire_disk_utilization_ratio >= 0.8 and glyphquire_disk_utilization_ratio < 0.9
        labels:
          severity: warning
          phase6_alert: disk_capacity
        annotations:
          summary: GlyphQuire disk utilization reached eighty percent
          delivery_deadline: 5m
      - alert: GlyphQuireDiskCapacityCritical
        expr: glyphquire_disk_utilization_ratio >= 0.9
        labels:
          severity: critical
          phase6_alert: disk_capacity
        annotations:
          summary: GlyphQuire disk utilization reached ninety percent
          delivery_deadline: 5m

services:
  evaluator:
    image: ${RELEASE_ALERT_RUNTIME_REPOSITORY:?RELEASE_ALERT_RUNTIME_REPOSITORY is required}@sha256:${RELEASE_ALERT_RUNTIME_DIGEST:?RELEASE_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/release-alert-runtime.ts
      - --mode=evaluator
    environment:
      RELEASE_ALERT_RUNTIME_PORT: "8080"
      RELEASE_ALERT_PROBE_URL: http://api:3000/api/health
      RELEASE_ALERT_ROUTER_URL: http://router:8080/events
    networks:
      - release-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  router:
    image: ${RELEASE_ALERT_RUNTIME_REPOSITORY:?RELEASE_ALERT_RUNTIME_REPOSITORY is required}@sha256:${RELEASE_ALERT_RUNTIME_DIGEST:?RELEASE_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/release-alert-runtime.ts
      - --mode=router
    environment:
      RELEASE_ALERT_RUNTIME_PORT: "8080"
      RELEASE_ALERT_RECEIVER_URL: http://receiver:8080/events
    networks:
      - release-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  receiver:
    image: ${RELEASE_ALERT_RUNTIME_REPOSITORY:?RELEASE_ALERT_RUNTIME_REPOSITORY is required}@sha256:${RELEASE_ALERT_RUNTIME_DIGEST:?RELEASE_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/release-alert-receiver.ts
    environment:
      RELEASE_ALERT_RECEIVER_PORT: "8080"
      RELEASE_ALERT_EVIDENCE_HOST_PATH: /evidence/alert-evidence.json
    volumes:
      - ${RELEASE_ALERT_EVIDENCE_HOST_PATH:?RELEASE_ALERT_EVIDENCE_HOST_PATH is required}:/evidence/alert-evidence.json
    networks:
      - release-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  release-observability:
    name: glyphquire-release-observability

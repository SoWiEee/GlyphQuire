global:
  resolve_timeout: 5m

route:
  receiver: phase6-operator-channel
  group_by:
    - alertname
    - phase6_alert
  group_wait: 0s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - receiver: phase6-operator-channel
      matchers:
        - phase6_alert=~"probe_failure|backup_failure|dead_letter|oldest_queue_age|database_capacity|disk_capacity"

receivers:
  - name: phase6-operator-channel
    webhook_configs:
      - url: http://receiver:8080/events
        send_resolved: true

services:
  evaluator:
    image: ${PHASE6_ALERT_RUNTIME_REPOSITORY:?PHASE6_ALERT_RUNTIME_REPOSITORY is required}@sha256:${PHASE6_ALERT_RUNTIME_DIGEST:?PHASE6_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/phase6-alert-runtime.ts
      - --mode=evaluator
    environment:
      PHASE6_ALERT_RUNTIME_PORT: "8080"
      PHASE6_ALERT_PROBE_URL: http://api:3000/api/health
      PHASE6_ALERT_ROUTER_URL: http://router:8080/events
    networks:
      - phase6-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  router:
    image: ${PHASE6_ALERT_RUNTIME_REPOSITORY:?PHASE6_ALERT_RUNTIME_REPOSITORY is required}@sha256:${PHASE6_ALERT_RUNTIME_DIGEST:?PHASE6_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/phase6-alert-runtime.ts
      - --mode=router
    environment:
      PHASE6_ALERT_RUNTIME_PORT: "8080"
      PHASE6_ALERT_RECEIVER_URL: http://receiver:8080/events
    networks:
      - phase6-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  receiver:
    image: ${PHASE6_ALERT_RUNTIME_REPOSITORY:?PHASE6_ALERT_RUNTIME_REPOSITORY is required}@sha256:${PHASE6_ALERT_RUNTIME_DIGEST:?PHASE6_ALERT_RUNTIME_DIGEST must be a 64-character lowercase SHA-256 digest}
    working_dir: /app
    command:
      - /app/phase6-alert-receiver.ts
    environment:
      PHASE6_ALERT_RECEIVER_PORT: "8080"
      PHASE6_ALERT_EVIDENCE_HOST_PATH: /evidence/alert-evidence.json
    volumes:
      - ${PHASE6_ALERT_EVIDENCE_HOST_PATH:?PHASE6_ALERT_EVIDENCE_HOST_PATH is required}:/evidence/alert-evidence.json
    networks:
      - phase6-observability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  phase6-observability:
    name: glyphquire-phase6-observability

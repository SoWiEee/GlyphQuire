name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint, Build, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glyphquire
          POSTGRES_PASSWORD: glyphquire
          POSTGRES_DB: glyphquire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glyphquire -d glyphquire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://glyphquire:glyphquire@localhost:5432/glyphquire_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm -r test

      - name: Cross-package scaffold
        run: pnpm test:cross-package

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Chrome scaffold
        run: pnpm exec playwright test tests/e2e/scaffold.spec.ts

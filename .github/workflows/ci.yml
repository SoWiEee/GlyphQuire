name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint, Build, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glyphquire
          POSTGRES_PASSWORD: glyphquire
          POSTGRES_DB: glyphquire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glyphquire -d glyphquire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://glyphquire:glyphquire@localhost:5432/glyphquire_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Format
        run: pnpm format:check

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://glyphquire:glyphquire@localhost:5432/glyphquire_test

      - name: Unit tests
        run: pnpm -r test

      - name: Integration tests
        run: pnpm test:integration

      - name: Phase 6 deterministic integration tests
        run: pnpm test:integration:phase6

      - name: Cross-package scaffold
        run: pnpm test:cross-package

      - name: Install local Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Chrome E2E, accessibility, security, and performance evidence
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Phase 2 load test (tests/load/autosave-conflict.ts): this CI job has
      # no running `apps/api` service and no seeded workspace ids, so the
      # script's own preflight check prints exactly what's missing and
      # exits 0 rather than failing the gate on infrastructure this job
      # does not stand up. See docs/evidence/phase2/README.md — this is not
      # the deferred P0-08 thirty-minute workload.
      - name: Phase 2 autosave/conflict load profile
        run: pnpm test:load:phase2

  phase6-release-candidate:
    name: Phase 6 release candidate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PHASE6_RELEASE_ENABLED == 'true' }}
    needs: check
    runs-on: ubuntu-latest
    environment: phase6-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build immutable Phase 6 service images
        env:
          IMAGE_TAG: phase6-${{ github.sha }}
        run: |
          docker build --file infra/phase6/images/api.Dockerfile --tag glyphquire-api:"$IMAGE_TAG" .
          docker build --file infra/phase6/images/web.Dockerfile --tag glyphquire-web:"$IMAGE_TAG" .
          docker build --file infra/phase6/images/worker.Dockerfile --tag glyphquire-worker:"$IMAGE_TAG" .
      - name: Verify release target configuration
        env:
          PHASE6_BASE_URL: ${{ secrets.PHASE6_BASE_URL }}
          PHASE6_HOSTED_ENV_FILE: ${{ secrets.PHASE6_HOSTED_ENV_FILE }}
          PHASE6_ALERT_RUNTIME_REPOSITORY: ${{ secrets.PHASE6_ALERT_RUNTIME_REPOSITORY }}
          PHASE6_ALERT_RUNTIME_DIGEST: ${{ secrets.PHASE6_ALERT_RUNTIME_DIGEST }}
        run: test -n "$PHASE6_BASE_URL" && test -n "$PHASE6_HOSTED_ENV_FILE" && test -n "$PHASE6_ALERT_RUNTIME_REPOSITORY" && test -n "$PHASE6_ALERT_RUNTIME_DIGEST"
      - name: Phase 6 observability evidence
        run: pnpm test:integration:phase6-observability
        env:
          PHASE6_ALERT_EVIDENCE_HOST_PATH: ${{ secrets.PHASE6_ALERT_EVIDENCE_HOST_PATH }}
          PHASE5_ALERT_EVIDENCE_FILE: ${{ secrets.PHASE5_ALERT_EVIDENCE_FILE }}
          PHASE6_ALERT_EVIDENCE_FILE: ${{ secrets.PHASE6_ALERT_EVIDENCE_FILE }}
          PHASE6_ALERT_RUNTIME_REPOSITORY: ${{ secrets.PHASE6_ALERT_RUNTIME_REPOSITORY }}
          PHASE6_ALERT_RUNTIME_DIGEST: ${{ secrets.PHASE6_ALERT_RUNTIME_DIGEST }}
      - name: Phase 6 release gate
        run: pnpm test:release:phase6
        env:
          PHASE6_BASE_URL: ${{ secrets.PHASE6_BASE_URL }}
          PHASE6_HOSTED_ENV_FILE: ${{ secrets.PHASE6_HOSTED_ENV_FILE }}

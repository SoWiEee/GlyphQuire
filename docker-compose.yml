services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glyphquire_dev
      POSTGRES_USER: glyphquire_migration
      POSTGRES_PASSWORD: glyphquire_migration_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Existing Phase 0 volumes do not have glyphquire_migration until the
      # explicit upgrade profile runs. Probe the local postmaster rather than
      # authenticating as a role that cannot exist on both sides of the upgrade.
      test: ["CMD-SHELL", 'gosu postgres pg_ctl status -D "$$PGDATA"']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-phase0-role-upgrade:
    image: postgres:16-alpine
    profiles: ["phase0-upgrade"]
    environment:
      # Committed local-only credential for the legacy Phase 0 Compose role.
      PGPASSWORD: glyphquire_dev
    volumes:
      - ./infra/postgres/upgrade:/upgrade:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --host=postgres
      - --username=glyphquire
      - --dbname=glyphquire_dev
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --file=/upgrade/001_phase0_roles.sql
    restart: "no"

  postgres-role-preflight:
    image: postgres:16-alpine
    profiles: ["phase0-upgrade"]
    environment:
      PGPASSWORD: glyphquire_migration_dev
    volumes:
      - ./infra/postgres/upgrade:/upgrade:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --host=postgres
      - --username=glyphquire_migration
      - --dbname=glyphquire_dev
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --file=/upgrade/002_role_preflight.sql
    restart: "no"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: glyphquire
      MINIO_ROOT_PASSWORD: glyphquire_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional workspace-services worker profile. The image is supplied by the deployment
  # pipeline and must include a real BackupVerifier; the worker intentionally
  # fails closed when that verifier is not injected.
  worker:
    profiles: ["workspace-services"]
    image: "${GLYPHQUIRE_WORKER_IMAGE:-glyphquire-worker:workspace-services}"
    init: true
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: "${WORKER_DATABASE_URL:-postgresql://glyphquire_app:glyphquire_app_dev@postgres:5432/glyphquire_dev}"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-glyphquire}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_BUCKET: "${S3_BUCKET:-glyphquire-assets}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      IDEMPOTENCY_ENCRYPTION_KEY: "${IDEMPOTENCY_ENCRYPTION_KEY:-}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
    command: ["node", "dist/index.js"]

  sandbox:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    ports:
      - "5174:80"

volumes:
  pgdata:
  minio_data:
